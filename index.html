<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habit Lab</title>
    <!-- Favicon usando png -->
    <link rel="icon" type="image/png" href="./img/favicon2.png">

    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    
</head>
<body>
    <h1>Habit Lab</h1>
    <form>
        <input type="text" id="name" placeholder="Nombre del hábito">
        <select id="energy">
            <option>Alta</option>
            <option>Media</option>
            <option>Baja</option>
        </select>
        <button>
            Agregar Hábito
        </button>
    </form>
    
    <!-- Filtros  -->
    <div>
        <button>Todos</button>
        <button>Pendientes</button>
        <button>Completados</button>
    </div>

    <!-- Lista de hábitos -->
    <div id="lista">
        <!-- Aquí se mostrarán los hábitos -->
    </div>
<script type="module" src="./js/app.js"></script>
</body>
</html>
